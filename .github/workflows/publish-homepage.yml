name: Publish homepage
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new interface
        run: |
          rm -f index.html
          mv DIEN-LANH-THANH-TIN-9-TRANG_0_kq0d.html index.html
          git config user.name "tuongtacviet"
          git config user.email "tuongtacviet@users.noreply.github.com"
          git add -A
          git commit -m "Update homepage to the newest 9-page Điện Lạnh Thành Tín interface"
          git push
